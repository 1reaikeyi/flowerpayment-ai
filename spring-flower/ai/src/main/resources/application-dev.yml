flower:
  logging: info
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: use_flower
    username: root
    password: ${MYSQL_PASSWORD}
  #redis配置文件
  redis:
    host: 192.168.80.128
    port: 6379
    password: ${MYSQL_PASSWORD}
    database: 2
  #ai配置文件
  ai:
    base-url: https://api-inference.modelscope.cn
    api-key: ${PATH_ai_qwen_api}
    chat:
      model: Qwen/Qwen3.5-27B

