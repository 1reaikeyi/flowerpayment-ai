#端口
server:
  port: 8080
# 日志配置
logging:
  level:
    flower:
      web_controller: ${flower.logging:info}
# springIOC
spring:
  application:
    name: love-flower-main
  # 项目配置文件
  profiles:
    active: dev
  # 缓存配置
  cache:
    type: redis
    redis:
      cache-null-values: false
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 导入文件
  config:
    import: classpath:redis.yml, classpath:mysql.yml


# jwt配置
jwt:
  # 设置jwt签名加密时使用的秘钥
  admin-secret-key: huawei_secret_for_spring_security_generation_as_jwt_to_use_admin
  # 设置jwt过期时间
  admin-ttl: 864000000
  # 设置前端传递过来的令牌名称
  admin-token-name: token
  # 设置jwt签名加密时使用的秘钥
  user-secret-key: huawei_secret_for_spring_security_generation_as_jwt_to_use_user
  # 设置jwt过期时间
  user-ttl: 864000000
  # 设置前端传递过来的令牌名称
  user-token-name: token
# 阿里云OSS配置
alioss:
  endpoint: ${flower.endpoint}
  access-key-id: ${flower.access-key-id}
  access-key-secret: ${flower.access-key-secret}
  bucket-name: ${flower.bucket-name}
# 支付宝支付配置
alipay:
  gatewayUrl: ${flower.alipay.gateway-url:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  appId: ${flower.alipay.app-id}
  appPrivateKey: ${flower.alipay.app-private-key}
  alipayPublicKey: ${flower.alipay.alipay-public-key}
  format: ${flower.alipay.format:JSON}
  charset: ${flower.alipay.charset:UTF-8}
  signType: ${flower.alipay.sign-type:RSA2}
  # 必填：回调地址（notify必须公网可访问；return给前端页面）
  notifyUrl: ${flower.alipay.notify-url}
  returnUrl: ${flower.alipay.return-url}




