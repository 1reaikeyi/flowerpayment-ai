spring:
  # 数据库配置
  datasource:
    driver-class-name: ${flower.datasource.driver-class-name}
    url: jdbc:mysql://${flower.datasource.host}:${flower.datasource.port}/${flower.datasource.database}
    username: ${flower.datasource.username}
    password: ${flower.datasource.password}

# Mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #开启驼峰命名
    map-underscore-to-camel-case: true
  type-enums-package: model.entityenum