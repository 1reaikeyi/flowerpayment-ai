spring:
  # redis配置文件
  data:
    redis:
      host: ${flower.redis.host}
      port: ${flower.redis.port}
      password: ${flower.redis.password}
      database: ${flower.redis.database}
      client-type: lettuce
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-wait: 3000ms
          max-idle: 8
          min-idle: 2
      # Redisson 配置：单节点模式，复用上方 redis 连接参数
      # 注意：config 必须使用 | 块标量，内容作为字符串交给 Redisson 自行解析
      redisson:
        config: |
          singleServerConfig:
            # Redis 连接地址（必须带 redis:// 协议前缀）
            address: "redis://${flower.redis.host}:${flower.redis.port}"
            # 数据库索引
            database: ${flower.redis.database}
            # 访问密码
            password: ${flower.redis.password}
            # 连接池大小
            connectionPoolSize: 10
            # 最小空闲连接数
            connectionMinimumIdleSize: 2
            # 命令执行超时（毫秒）
            timeout: 3000